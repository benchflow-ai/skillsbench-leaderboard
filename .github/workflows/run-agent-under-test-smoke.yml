name: Run Agent Under Test Smoke

on:
  workflow_dispatch:
    inputs:
      green_agent_id:
        description: "Registered SkillsBench green AgentBeats UUID (empty keeps scenario metadata)"
        default: ""
        type: string
      purple_agent_id:
        description: "Registered purple AgentBeats UUID for the agent-under-test (empty keeps scenario metadata)"
        default: ""
        type: string
      timeout_minutes:
        description: "Timeout while waiting for the one-task result"
        default: "90"
        type: string

jobs:
  dialogue-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      AMBER_IMAGE: ghcr.io/rdi-foundation/amber-cli:v0.3
      AMBER_COMPOSE_DIR: amber-compose-agent-under-test
      AMBER_COMPOSE_PROJECT: amber-agent-under-test-${{ github.run_id }}-${{ github.run_attempt }}
      AMBER_PROXY_PORT: "18081"
      RESULTS_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || '90' }}

    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/chromium /usr/local/graalvm /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v6

      - name: Export agent-under-test secret for Amber
        env:
          AGENT_UNDER_TEST_API_KEY: ${{ secrets.AGENT_UNDER_TEST__API_KEY || secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AGENT_UNDER_TEST_API_KEY}" ]]; then
            echo "Missing repo secret AGENT_UNDER_TEST__API_KEY or GEMINI_API_KEY" >&2
            exit 1
          fi
          echo "::add-mask::${AGENT_UNDER_TEST_API_KEY}"
          {
            echo "AMBER_CONFIG_AGENT_UNDER_TEST__API_KEY<<__AGENT_UNDER_TEST_KEY__"
            printf '%s\n' "${AGENT_UNDER_TEST_API_KEY}"
            echo "__AGENT_UNDER_TEST_KEY__"
            echo "AMBER_CONFIG_AGENT_UNDER_TEST__HARNESS=openhands"
            echo "AMBER_CONFIG_AGENT_UNDER_TEST__MODEL=gemini/gemini-3.5-flash"
            echo "AMBER_CONFIG_AGENT_UNDER_TEST__TIMEOUT_SEC=900"
          } >> "${GITHUB_ENV}"

      - name: Patch optional AgentBeats IDs
        env:
          GREEN_AGENT_ID: ${{ inputs.green_agent_id || '' }}
          PURPLE_AGENT_ID: ${{ inputs.purple_agent_id || '' }}
        run: |
          set -euo pipefail
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          if [[ -n "${GREEN_AGENT_ID}" && ! "${GREEN_AGENT_ID}" =~ ${uuid_re} ]]; then
            echo "green_agent_id must be a registered AgentBeats UUID" >&2
            exit 1
          fi
          if [[ -n "${PURPLE_AGENT_ID}" && ! "${PURPLE_AGENT_ID}" =~ ${uuid_re} ]]; then
            echo "purple_agent_id must be a registered AgentBeats UUID" >&2
            exit 1
          fi
          npx --yes json5 scenario-agent-under-test-smoke.json5 | jq \
            --arg green_agent_id "${GREEN_AGENT_ID}" \
            --arg purple_agent_id "${PURPLE_AGENT_ID}" \
            '
             if $green_agent_id != "" then .metadata.agentbeats_ids.skillsbench_green = $green_agent_id else . end |
             if $purple_agent_id != "" then
               .metadata.agentbeats_ids.agent = $purple_agent_id |
               .metadata.agentbeats_ids.agent_under_test = $purple_agent_id |
               .components.gateway.config.assessment_config.participant_ids.agent = $purple_agent_id
             else . end
            ' > scenario-agent-under-test-smoke.patched.json
          mv scenario-agent-under-test-smoke.patched.json scenario-agent-under-test-smoke.json5

      - name: Install Amber CLI
        run: |
          set -euo pipefail
          docker pull "${AMBER_IMAGE}"
          cid="$(docker create "${AMBER_IMAGE}")"
          cleanup() { docker rm "${cid}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          install -d "${RUNNER_TEMP}/bin"
          docker cp "${cid}:/amber" "${RUNNER_TEMP}/bin/amber"
          chmod +x "${RUNNER_TEMP}/bin/amber"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/amber" --help >/dev/null

      - name: Compile one-task scenario
        run: |
          set -euo pipefail
          rm -rf "${AMBER_COMPOSE_DIR}"
          amber compile scenario-agent-under-test-smoke.json5 \
            --output scenario-ir.json \
            --docker-compose "${AMBER_COMPOSE_DIR}"
          jq -e '.exports[] | select(.name == "results" and .capability.kind == "http")' scenario-ir.json >/dev/null

      - name: Run one-task scenario
        run: |
          set -euo pipefail
          compose=(docker compose -f "${AMBER_COMPOSE_DIR}/compose.yaml" -p "${AMBER_COMPOSE_PROJECT}")
          proxy_pid=""
          logs_pid=""
          cleanup() {
            exit_code=$?
            if [[ -n "${proxy_pid}" ]]; then
              kill "${proxy_pid}" >/dev/null 2>&1 || true
              wait "${proxy_pid}" >/dev/null 2>&1 || true
            fi
            if [[ -n "${logs_pid}" ]]; then
              kill "${logs_pid}" >/dev/null 2>&1 || true
              wait "${logs_pid}" >/dev/null 2>&1 || true
            fi
            if [[ ${exit_code} -ne 0 ]]; then
              [[ -f amber-proxy.log ]] && cat amber-proxy.log >&2 || true
              "${compose[@]}" ps >&2 || true
            fi
            "${compose[@]}" down -v --remove-orphans >/dev/null 2>&1 || true
            exit "${exit_code}"
          }
          trap cleanup EXIT

          "${compose[@]}" pull --quiet
          "${compose[@]}" up -d
          "${compose[@]}" logs -f --no-color &
          logs_pid=$!

          amber proxy "${AMBER_COMPOSE_DIR}" \
            --project-name "${AMBER_COMPOSE_PROJECT}" \
            --export "results=127.0.0.1:${AMBER_PROXY_PORT}" > amber-proxy.log 2>&1 &
          proxy_pid=$!

          poll_url="http://127.0.0.1:${AMBER_PROXY_PORT}/"
          status=""
          deadline=$((SECONDS + (60 * RESULTS_TIMEOUT_MINUTES)))
          while (( SECONDS < deadline )); do
            if ! kill -0 "${proxy_pid}" >/dev/null 2>&1; then
              echo "amber proxy exited unexpectedly" >&2
              exit 1
            fi
            response="$(curl -fsS "${poll_url}" || true)"
            if [[ -z "${response}" ]]; then
              sleep 5
              continue
            fi
            status="$(jq -r '.status // empty' <<<"${response}")"
            if [[ -z "${status}" ]]; then
              echo "Unexpected results payload:" >&2
              echo "${response}" >&2
              sleep 5
              continue
            fi
            if [[ "${status}" != "running" ]]; then
              mkdir -p "${AMBER_COMPOSE_DIR}/output"
              jq . <<<"${response}" > "${AMBER_COMPOSE_DIR}/output/results.json"
              break
            fi
            sleep 5
          done
          if [[ ! -f "${AMBER_COMPOSE_DIR}/output/results.json" ]]; then
            echo "Timed out waiting ${RESULTS_TIMEOUT_MINUTES} minutes for one-task result" >&2
            exit 1
          fi
          if [[ "${status}" != "completed" ]]; then
            cat "${AMBER_COMPOSE_DIR}/output/results.json" >&2
            exit 1
          fi

      - name: Validate result contract
        run: |
          set -euo pipefail
          jq -e '
            .status == "completed" and
            ([.results[]
              | if type == "object" and (.results | type == "array") then .results[] else . end
              | select(type == "object")
            ]) as $rows |
            ($rows | length) == 1 and
            $rows[0].task_id == "dialogue-parser" and
            $rows[0].agent_transport == "a2a" and
            $rows[0].participant_role == "agent" and
            $rows[0].score_eligible == true and
            (($rows[0].infra_failure_type // null) == null)
          ' "${AMBER_COMPOSE_DIR}/output/results.json"

      - name: Upload one-task result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-under-test-dialogue-parser
          path: |
            ${{ env.AMBER_COMPOSE_DIR }}/output/results.json
            scenario-ir.json
