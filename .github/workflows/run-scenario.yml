# Self-run workflow — fork owners trigger this by pushing changes to scenario.json5.
name: Run Scenario

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'scenario.json5'
  workflow_dispatch:
    inputs:
      num_shards:
        description: "Number of parallel shards (empty keeps scenario default)"
        default: ""
        type: string
      num_instances:
        description: "Total number of task instances to run across all shards (empty = all)"
        default: ""
        type: string
      task_set:
        description: "Optional public task-set manifest name (empty keeps scenario metadata)"
        default: ""
        type: string
      green_agent_id:
        description: "Registered SkillsBench green AgentBeats UUID (empty keeps scenario metadata)"
        default: ""
        type: string
      purple_agent_id:
        description: "Registered purple AgentBeats UUID for public result participants (empty keeps scenario metadata)"
        default: ""
        type: string
      require_durable_private_proof:
        description: "Require durable private-proof settings for the SkillsBench worker"
        default: false
        type: boolean
      private_proof_uri_prefix:
        description: "Durable private proof URI prefix (s3://, gs://, or r2://)"
        default: ""
        type: string
      private_proof_retention:
        description: "Durable private proof retention policy (for example, 90d)"
        default: ""
        type: string
      scenario_path:
        description: "Scenario JSON5 path to run"
        default: "scenario.json5"
        type: string
      agent_harness:
        description: "Agent-under-test harness for agent-under-test scenarios"
        default: "openhands"
        type: string
      agent_model:
        description: "Agent-under-test model for agent-under-test scenarios"
        default: "gemini/gemini-3.5-flash"
        type: string
      agent_timeout_sec:
        description: "Agent-under-test timeout in seconds"
        default: "900"
        type: string

env:
  SCENARIO_PATH: ${{ inputs.scenario_path || 'scenario.json5' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shard_indices: ${{ steps.gen.outputs.shard_indices }}
      num_shards: ${{ steps.gen.outputs.num_shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate shard matrix
        id: gen
        env:
          NUM_SHARDS_INPUT: ${{ inputs.num_shards || '' }}
        run: |
          set -euo pipefail
          num_shards="${NUM_SHARDS_INPUT}"
          if [[ -z "${num_shards}" ]]; then
            num_shards="$(npx --yes json5 "${SCENARIO_PATH}" | jq -r '.components.gateway.config.assessment_config.num_shards // 1')"
          fi
          if [[ ! "${num_shards}" =~ ^[1-9][0-9]*$ ]]; then
            echo "num_shards must be a positive integer" >&2
            exit 1
          fi
          echo "num_shards=${num_shards}" >> "$GITHUB_OUTPUT"
          echo "shard_indices=$(seq 0 $(( num_shards - 1 )) | jq -sc .)" >> "$GITHUB_OUTPUT"

  eval:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      matrix:
        shard_index: ${{ fromJSON(needs.setup.outputs.shard_indices) }}
      fail-fast: false

    permissions:
      id-token: write
      contents: read

    env:
      NUM_SHARDS: ${{ needs.setup.outputs.num_shards }}
      GCP_PROJECT_ID: ${{ vars.SKILLSBENCH_GCP_PROJECT_ID || vars.GCP_PROJECT_ID || 'skillsbench' }}
      GCP_WIF_PROVIDER: ${{ vars.SKILLSBENCH_GCP_WIF_PROVIDER || vars.GCP_WIF_PROVIDER || '' }}
      GCP_SERVICE_ACCOUNT: ${{ vars.SKILLSBENCH_PRIVATE_PROOF_GCP_SERVICE_ACCOUNT || vars.GCP_SERVICE_ACCOUNT || '' }}
      AMBER_IMAGE: ghcr.io/rdi-foundation/amber-cli:v0.3
      AMBER_COMPOSE_DIR: amber-compose
      AMBER_COMPOSE_PROJECT: amber-scenario-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard_index }}
      AMBER_PROXY_PORT: "18080"
      AMBER_PARTICIPANT_PROXY_PORT: "18081"
      RESULTS_TIMEOUT_MINUTES: ${{ vars.RUN_SCENARIO_TIMEOUT_MINUTES || '300' }}

    steps:
      - name: Free disk space
        # GitHub-hosted runners ship with ~20-30 GB of pre-installed toolchains
        # (.NET, Android SDK, GraalVM, Chromium, etc.) not needed.
        # Benchmark scenarios often pull large Docker images.
        # See https://github.com/marketplace/actions/free-disk-space-ubuntu
        run: |
          echo "Before: $(df -h / | tail -1 | awk '{print $4}') free"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/chromium /usr/local/graalvm /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          echo "After: $(df -h / | tail -1 | awk '{print $4}') free"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Export AMBER_CONFIG vars
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          # Export all repo secrets as AMBER_CONFIG_* env vars.
          # Secret names should match the scenario config_schema path with double
          # underscores as separators, e.g. a secret named FOO__BAR maps to
          # config.foo.bar in the scenario.
          # Agent-under-test secrets are normalized in the dedicated alias step.
          echo "$SECRETS_JSON" | jq -r \
            'to_entries[] | select(.key != "GITHUB_TOKEN" and (.key | startswith("AGENT_UNDER_TEST__") | not)) | "AMBER_CONFIG_\(.key | ascii_upcase)=\(.value | sub("\\s+$";""))"' \
            >> "${GITHUB_ENV}"

      - name: Export agent-under-test secret alias
        if: inputs.scenario_path == 'scenario-agent-under-test-smoke.json5' || inputs.scenario_path == 'scenario-standard-v1.json5'
        env:
          AGENT_UNDER_TEST_API_KEY: ${{ secrets.AGENT_UNDER_TEST__API_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.AGENT_UNDER_TEST__OPENAI_API_KEY || secrets.OPENAI_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ secrets.AGENT_UNDER_TEST__ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.AGENT_UNDER_TEST__GEMINI_API_KEY || secrets.GEMINI_API_KEY || secrets.GOOGLE_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ secrets.AGENT_UNDER_TEST__OPENROUTER_API_KEY || secrets.OPENROUTER_API_KEY || '' }}
          QWEN_API_KEY: ${{ secrets.AGENT_UNDER_TEST__QWEN_API_KEY || secrets.QWEN_API_KEY || secrets.DASHSCOPE_API_KEY || '' }}
          DEEPSEEK_API_KEY: ${{ secrets.AGENT_UNDER_TEST__DEEPSEEK_API_KEY || secrets.DEEPSEEK_API_KEY || '' }}
          MINIMAX_API_KEY: ${{ secrets.AGENT_UNDER_TEST__MINIMAX_API_KEY || secrets.MINIMAX_API_KEY || '' }}
          GLM_API_KEY: ${{ secrets.AGENT_UNDER_TEST__GLM_API_KEY || secrets.GLM_API_KEY || secrets.ZAI_API_KEY || '' }}
          KIMI_API_KEY: ${{ secrets.AGENT_UNDER_TEST__KIMI_API_KEY || secrets.KIMI_API_KEY || secrets.MOONSHOT_API_KEY || '' }}
          XIAOMI_API_KEY: ${{ secrets.AGENT_UNDER_TEST__XIAOMI_API_KEY || secrets.XIAOMI_API_KEY || '' }}
          DOUBAO_API_KEY: ${{ secrets.AGENT_UNDER_TEST__DOUBAO_API_KEY || secrets.DOUBAO_API_KEY || secrets.ARK_API_KEY || '' }}
          HUNYUAN_API_KEY: ${{ secrets.AGENT_UNDER_TEST__HUNYUAN_API_KEY || secrets.HUNYUAN_API_KEY || '' }}
          AGENT_HARNESS: ${{ inputs.agent_harness || 'openhands' }}
          AGENT_MODEL: ${{ inputs.agent_model || 'gemini/gemini-3.5-flash' }}
          AGENT_TIMEOUT_SEC: ${{ inputs.agent_timeout_sec || '900' }}
        run: .github/scripts/export-agent-under-test-config.sh

      - name: Patch shard config into scenario
        env:
          GREEN_AGENT_ID: ${{ inputs.green_agent_id || '' }}
          PURPLE_AGENT_ID: ${{ inputs.purple_agent_id || '' }}
          TASK_SET_INPUT: ${{ inputs.task_set || '' }}
          REQUIRE_DURABLE_PRIVATE_PROOF: ${{ inputs.require_durable_private_proof && 'true' || 'false' }}
          PRIVATE_PROOF_URI_PREFIX: ${{ inputs.private_proof_uri_prefix || '' }}
          PRIVATE_PROOF_RETENTION: ${{ inputs.private_proof_retention || '' }}
        run: |
          set -euo pipefail
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          task_set_re='^[A-Za-z0-9_.-]+$'
          durable_uri_re='^(s3|gs|r2)://'
          if [[ -n "${GREEN_AGENT_ID}" && ! "${GREEN_AGENT_ID}" =~ ${uuid_re} ]]; then
            echo "green_agent_id must be a registered AgentBeats UUID" >&2
            exit 1
          fi
          if [[ -n "${PURPLE_AGENT_ID}" && ! "${PURPLE_AGENT_ID}" =~ ${uuid_re} ]]; then
            echo "purple_agent_id must be a registered AgentBeats UUID" >&2
            exit 1
          fi
          task_set_manifest='null'
          prebuilt_manifest='null'
          if [[ -n "${TASK_SET_INPUT}" ]]; then
            if [[ ! "${TASK_SET_INPUT}" =~ ${task_set_re} ]]; then
              echo "task_set must be a direct task_sets/*.json manifest name" >&2
              exit 1
            fi
            task_set_path="task_sets/${TASK_SET_INPUT}.json"
            if [[ ! -f "${task_set_path}" ]]; then
              echo "task_set manifest not found: ${task_set_path}" >&2
              exit 1
            fi
            task_set_manifest="$(jq -c . "${task_set_path}")"
            prebuilt_path="prebuilt_images/${TASK_SET_INPUT}.json"
            if [[ -f "${prebuilt_path}" && "${TASK_SET_INPUT}" != "standard-v1" ]]; then
              jq -e '
                type == "object" and
                all(to_entries[]; (.key | type == "string") and (.value | type == "string" and contains("@sha256:")))
              ' "${prebuilt_path}" >/dev/null
              prebuilt_manifest="$(jq -c . "${prebuilt_path}")"
            fi
          fi
          if [[ "${REQUIRE_DURABLE_PRIVATE_PROOF}" == "true" ]]; then
            if [[ ! "${PRIVATE_PROOF_URI_PREFIX}" =~ ${durable_uri_re} ]]; then
              echo "private_proof_uri_prefix must use s3://, gs://, or r2:// when durable proof is required by this workflow" >&2
              exit 1
            fi
            if [[ "${PRIVATE_PROOF_URI_PREFIX}" =~ [?#] ]]; then
              echo "private_proof_uri_prefix must not contain a query string or fragment" >&2
              exit 1
            fi
            if [[ "${PRIVATE_PROOF_URI_PREFIX}" =~ (^local://|^file://|^memory://|localhost|127[.]0[.]0[.]1|^/) ]]; then
              echo "private_proof_uri_prefix must not be local or worker-local storage" >&2
              exit 1
            fi
            if [[ -z "${PRIVATE_PROOF_RETENTION}" || "${PRIVATE_PROOF_RETENTION}" =~ (local|debug|temporary|tmp|^none$|^0[[:alnum:]_]*) ]]; then
              echo "private_proof_retention must be a durable retention policy when durable proof is required" >&2
              exit 1
            fi
          elif [[ -n "${PRIVATE_PROOF_URI_PREFIX}" || -n "${PRIVATE_PROOF_RETENTION}" ]]; then
            echo "private proof overrides require require_durable_private_proof=true" >&2
            exit 1
          fi
          docker_bridge_host="$(ip -4 addr show docker0 2>/dev/null | awk '/inet / {print $2; exit}' | cut -d/ -f1)"
          docker_bridge_host="${docker_bridge_host:-172.17.0.1}"
          sandbox_participant_proxy_url="http://${docker_bridge_host}:${AMBER_PARTICIPANT_PROXY_PORT}"
          echo "Using sandbox participant proxy URL ${sandbox_participant_proxy_url}"
          npx json5 "${SCENARIO_PATH}" | jq \
            --argjson shard_index ${{ matrix.shard_index }} \
            --argjson num_shards ${NUM_SHARDS} \
            --argjson num_instances '${{ inputs.num_instances || 'null' }}' \
            --argjson task_set_manifest "${task_set_manifest}" \
            --argjson prebuilt_manifest "${prebuilt_manifest}" \
            --arg green_agent_id "${GREEN_AGENT_ID}" \
            --arg purple_agent_id "${PURPLE_AGENT_ID}" \
            --argjson require_durable_private_proof "${REQUIRE_DURABLE_PRIVATE_PROOF}" \
            --arg private_proof_uri_prefix "${PRIVATE_PROOF_URI_PREFIX}" \
            --arg private_proof_retention "${PRIVATE_PROOF_RETENTION}" \
            --arg sandbox_participant_proxy_url "${sandbox_participant_proxy_url}" \
            '
             .components.gateway.config.assessment_config.shard_index = $shard_index |
             .components.gateway.config.assessment_config.num_shards = $num_shards |
             if $task_set_manifest then
               .components.gateway.config.assessment_config.task_set = $task_set_manifest.task_set |
               if $task_set_manifest.task_set == "standard-v1" then
                 .components.gateway.config.assessment_config.tasks = "all" |
                 del(.components.gateway.config.assessment_config.task_ids)
               else
                 .components.gateway.config.assessment_config.task_ids = ($task_set_manifest.tasks | map(.task_id)) |
                 del(.components.gateway.config.assessment_config.tasks)
               end |
               .components.gateway.config.assessment_config.condition = $task_set_manifest.condition |
               .components.gateway.config.assessment_config.allow_excluded_tasks = $task_set_manifest.allow_excluded_tasks
             else . end |
             if $prebuilt_manifest and (.components.skillsbench_worker? != null) then
               .components.skillsbench_worker.config.prebuilt_images = ($prebuilt_manifest | tojson)
             elif $prebuilt_manifest and (.components.skillsbench_green? != null) then
               .components.skillsbench_green.config.prebuilt_images = ($prebuilt_manifest | tojson)
             elif $prebuilt_manifest then
               error("prebuilt_images require a skillsbench_worker or skillsbench_green component")
             else . end |
             if .components.skillsbench_worker? != null then
               .components.skillsbench_worker.config.sandbox_participant_proxy_url = $sandbox_participant_proxy_url
             else . end |
             if .components.skillsbench_green? != null then
               .components.skillsbench_green.config.sandbox_participant_proxy_url = $sandbox_participant_proxy_url
             else . end |
             if $num_instances then .components.gateway.config.assessment_config.num_instances = $num_instances else . end |
             if $green_agent_id != "" then .metadata.agentbeats_ids.skillsbench_green = $green_agent_id else . end |
             if $purple_agent_id != "" then
               .metadata.agentbeats_ids.baseline_agent = $purple_agent_id |
               .components.gateway.config.assessment_config.participant_ids.agent = $purple_agent_id
             else . end |
             if $require_durable_private_proof and (.components.skillsbench_worker? != null) then
               .components.skillsbench_worker.config.require_durable_private_proof = true |
               .components.skillsbench_worker.config.private_proof_uri_prefix = $private_proof_uri_prefix |
               .components.skillsbench_worker.config.private_proof_retention = $private_proof_retention
             elif $require_durable_private_proof and (.components.skillsbench_green? != null) then
               .components.skillsbench_green.config.require_durable_private_proof = true |
               .components.skillsbench_green.config.private_proof_uri_prefix = $private_proof_uri_prefix |
               .components.skillsbench_green.config.private_proof_retention = $private_proof_retention
             elif $require_durable_private_proof then
               error("durable private proof requires a skillsbench_worker or skillsbench_green component")
             else . end
            ' > patched.json
          mv patched.json "${SCENARIO_PATH}"

      - name: Install amber CLI
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${AMBER_IMAGE}"
          cid="$(docker create "${AMBER_IMAGE}")"
          cleanup() { docker rm "${cid}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          install -d "${RUNNER_TEMP}/bin"
          docker cp "${cid}:/amber" "${RUNNER_TEMP}/bin/amber"
          chmod +x "${RUNNER_TEMP}/bin/amber"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/amber" --help >/dev/null

      - name: Compile scenario
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${AMBER_COMPOSE_DIR}"
          amber compile "${SCENARIO_PATH}" \
            --output scenario-ir.json \
            --docker-compose "${AMBER_COMPOSE_DIR}"
          if ! jq -e '.exports[] | select(.name == "results" and .capability.kind == "http")' scenario-ir.json > /dev/null; then
            echo "Scenario must export an HTTP capability named 'results'" >&2
            exit 1
          fi

      - name: Run scenario — shard-${{ matrix.shard_index }}
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f "${AMBER_COMPOSE_DIR}/compose.yaml" -p "${AMBER_COMPOSE_PROJECT}")
          proxy_pid=""
          logs_pid=""
          cleanup() {
            exit_code=$?
            if [[ -n "${proxy_pid}" ]]; then
              kill "${proxy_pid}" >/dev/null 2>&1 || true
              wait "${proxy_pid}" >/dev/null 2>&1 || true
            fi
            if [[ -n "${logs_pid}" ]]; then
              kill "${logs_pid}" >/dev/null 2>&1 || true
              wait "${logs_pid}" >/dev/null 2>&1 || true
            fi
            if [[ ${exit_code} -ne 0 ]]; then
              echo "Amber proxy log:" >&2
              [[ -f amber-proxy.log ]] && cat amber-proxy.log >&2 || true
              echo "Compose status:" >&2
              "${compose[@]}" ps >&2 || true
            fi
            exit "${exit_code}"
          }
          trap cleanup EXIT

          "${compose[@]}" pull --quiet

          # Generate provenance (image digests + manifest digests).
          # All shards compile the same scenario and pull the same images,
          # so provenance is identical; summary picks one.
          image_digests=$(jq -r '.components[] | select(.program) | "\(.moniker)=\(.program.image)"' scenario-ir.json | while IFS='=' read -r name image; do
            digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
            printf '%s\t%s\n' "$name" "$digest"
          done | jq -Rn '[inputs | split("\t") | {(.[0]): .[1]}] | add // {}')
          manifest_digests=$(jq '[.components[] | {(.moniker): .digest}] | add // {}' scenario-ir.json)
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p "${AMBER_COMPOSE_DIR}/output"
          jq -n \
            --argjson image_digests "$image_digests" \
            --argjson manifest_digests "$manifest_digests" \
            --arg timestamp "$timestamp" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg ref "${{ github.ref }}" \
            --arg sha "${{ github.sha }}" \
            --arg repository_url "${{ github.server_url }}/${{ github.repository }}" \
            --arg workflow_ref "${{ github.workflow_ref }}" \
            --arg workflow_sha "${{ github.workflow_sha }}" \
            '{
              image_digests: $image_digests,
              manifest_digests: $manifest_digests,
              timestamp: $timestamp,
              github_actions: {
                run_url: $run_url,
                ref: $ref,
                sha: $sha,
                repository_url: $repository_url,
                workflow_ref: $workflow_ref,
                workflow_sha: $workflow_sha
              }
            }' > "${AMBER_COMPOSE_DIR}/output/provenance.json"
          echo "Provenance:"
          cat "${AMBER_COMPOSE_DIR}/output/provenance.json"

          docker_bridge_host="$(ip -4 addr show docker0 2>/dev/null | awk '/inet / {print $2; exit}' | cut -d/ -f1)"
          docker_bridge_host="${docker_bridge_host:-172.17.0.1}"

          gateway_service="$("${compose[@]}" config --format json | jq -r '
            .services
            | to_entries[]
            | select((.value.labels.amber_component_moniker // "") == "/gateway")
            | .key
          ' | head -n1)"
          if [[ -z "${gateway_service}" || "${gateway_service}" == "null" ]]; then
            echo "Could not identify the Amber /gateway compose service" >&2
            exit 1
          fi

          mapfile -t compose_services < <("${compose[@]}" config --services)
          non_gateway_services=()
          for service in "${compose_services[@]}"; do
            if [[ "${service}" != "${gateway_service}" ]]; then
              non_gateway_services+=("${service}")
            fi
          done

          echo "Starting compose services except gateway service ${gateway_service}..."
          "${compose[@]}" up -d "${non_gateway_services[@]}"

          amber proxy "${AMBER_COMPOSE_DIR}" \
            --project-name "${AMBER_COMPOSE_PROJECT}" \
            --export "results=127.0.0.1:${AMBER_PROXY_PORT}" \
            --export "participant_proxy=${docker_bridge_host}:${AMBER_PARTICIPANT_PROXY_PORT}" > amber-proxy.log 2>&1 &
          proxy_pid=$!

          wait_for_export_listener() {
            local name="$1"
            local url="$2"
            local wait_deadline=$((SECONDS + 60))
            local http_code=""
            echo "Waiting for ${name} export listener at ${url}..."
            while (( SECONDS < wait_deadline )); do
              if ! kill -0 "${proxy_pid}" >/dev/null 2>&1; then
                echo "amber proxy exited unexpectedly while waiting for ${name}" >&2
                exit 1
              fi
              http_code="$(curl -sS -o /dev/null -w "%{http_code}" --max-time 2 "${url}" || true)"
              if [[ "${http_code}" != "000" ]]; then
                echo "${name} export listener is accepting connections (HTTP ${http_code})"
                return 0
              fi
              sleep 1
            done
            echo "Timed out waiting for ${name} export listener at ${url}" >&2
            return 1
          }

          wait_for_export_listener "results" "http://127.0.0.1:${AMBER_PROXY_PORT}/"
          wait_for_export_listener "participant_proxy" "http://${docker_bridge_host}:${AMBER_PARTICIPANT_PROXY_PORT}/agent/.well-known/agent-card.json"

          echo "Starting gateway service ${gateway_service} after export listeners are ready..."
          "${compose[@]}" up -d "${gateway_service}"
          "${compose[@]}" logs -f --no-color &
          logs_pid=$!

          poll_url="http://127.0.0.1:${AMBER_PROXY_PORT}/"
          echo "Polling ${poll_url} for shard ${{ matrix.shard_index }}..."
          status=""
          deadline=$((SECONDS + (60 * RESULTS_TIMEOUT_MINUTES)))
          while (( SECONDS < deadline )); do
            if ! kill -0 "${proxy_pid}" >/dev/null 2>&1; then
              echo "amber proxy exited unexpectedly" >&2
              exit 1
            fi
            response="$(curl -fsS "${poll_url}" || true)"
            if [[ -z "${response}" ]]; then
              sleep 5
              continue
            fi
            status="$(jq -r '.status // empty' <<<"${response}")"
            if [[ -z "${status}" ]]; then
              echo "Unexpected results payload:" >&2
              echo "${response}" >&2
              sleep 5
              continue
            fi
            if [[ "${status}" != "running" ]]; then
              mkdir -p "${AMBER_COMPOSE_DIR}/output"
              jq . <<<"${response}" > "${AMBER_COMPOSE_DIR}/output/results.json"
              echo "Shard ${{ matrix.shard_index }} finished with status: ${status}"
              break
            fi
            sleep 5
          done
          if [[ ! -f "${AMBER_COMPOSE_DIR}/output/results.json" ]]; then
            echo "Timed out waiting ${RESULTS_TIMEOUT_MINUTES} minutes for shard results" >&2
            exit 1
          fi
          if [[ "${status}" != "completed" ]]; then
            echo "Shard failed:" >&2
            cat "${AMBER_COMPOSE_DIR}/output/results.json" >&2
            exit 1
          fi
        timeout-minutes: 300

      - name: Collect private proof
        if: always()
        env:
          REQUIRE_DURABLE_PRIVATE_PROOF: ${{ inputs.require_durable_private_proof && 'true' || 'false' }}
          PRIVATE_PROOF_URI_PREFIX: ${{ inputs.private_proof_uri_prefix || '' }}
          PRIVATE_PROOF_ROOT: ${{ runner.temp }}/skillsbench-private-proof
        run: |
          set -euo pipefail
          rm -rf "${PRIVATE_PROOF_ROOT}"
          mkdir -p "${PRIVATE_PROOF_ROOT}" "${AMBER_COMPOSE_DIR}/output"
          collected=0
          for moniker in /skillsbench_green /skillsbench_worker; do
            mapfile -t containers < <(
              docker ps -aq \
                --filter "label=com.docker.compose.project=${AMBER_COMPOSE_PROJECT}" \
                --filter "label=amber_component_moniker=${moniker}"
            )
            for cid in "${containers[@]}"; do
              if docker cp "${cid}:/home/worker/jobs/agentbeats-private-proof/." "${PRIVATE_PROOF_ROOT}/" 2>/dev/null; then
                collected=1
              fi
            done
          done
          if [[ "${collected}" != "1" ]]; then
            if [[ "${REQUIRE_DURABLE_PRIVATE_PROOF}" == "true" ]]; then
              echo "durable private proof is required but no worker proof directory was collected" >&2
              exit 1
            fi
            echo "No worker private proof directory was available to collect."
            exit 0
          fi
          if [[ "${REQUIRE_DURABLE_PRIVATE_PROOF}" == "true" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof_root = Path(os.environ["PRIVATE_PROOF_ROOT"])
          prefix = os.environ["PRIVATE_PROOF_URI_PREFIX"].rstrip("/")
          refs = [
              f"{prefix}/{path.relative_to(proof_root).as_posix()}"
              for path in sorted(proof_root.glob("*/proof.json"))
          ]
          if not refs:
              raise SystemExit("durable private proof is required but no proof.json manifests were collected")
          Path(os.environ["AMBER_COMPOSE_DIR"], "output", "private-proof-manifest-refs.json").write_text(
              json.dumps({"private_proof_manifest_refs": refs}, indent=2, sort_keys=True) + "\n"
          )
          PY
          fi

      - name: Validate GCP private proof auth
        if: ${{ always() && inputs.require_durable_private_proof && startsWith(inputs.private_proof_uri_prefix, 'gs://') }}
        run: |
          set -euo pipefail
          if [[ -z "${GCP_WIF_PROVIDER}" ]]; then
            echo "gs:// private proof publishing requires SKILLSBENCH_GCP_WIF_PROVIDER or GCP_WIF_PROVIDER" >&2
            exit 1
          fi
          if [[ -z "${GCP_SERVICE_ACCOUNT}" ]]; then
            echo "gs:// private proof publishing requires SKILLSBENCH_PRIVATE_PROOF_GCP_SERVICE_ACCOUNT or GCP_SERVICE_ACCOUNT" >&2
            exit 1
          fi

      - name: Authenticate to GCP for private proof
        if: ${{ always() && inputs.require_durable_private_proof && startsWith(inputs.private_proof_uri_prefix, 'gs://') }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up gcloud for private proof
        if: ${{ always() && inputs.require_durable_private_proof && startsWith(inputs.private_proof_uri_prefix, 'gs://') }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Publish private proof
        if: ${{ always() && inputs.require_durable_private_proof }}
        env:
          PRIVATE_PROOF_URI_PREFIX: ${{ inputs.private_proof_uri_prefix || '' }}
          PRIVATE_PROOF_ROOT: ${{ runner.temp }}/skillsbench-private-proof
          AWS_ACCESS_KEY_ID: ${{ secrets.SKILLSBENCH_PRIVATE_PROOF_AWS_ACCESS_KEY_ID || secrets.AWS_ACCESS_KEY_ID || '' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SKILLSBENCH_PRIVATE_PROOF_AWS_SECRET_ACCESS_KEY || secrets.AWS_SECRET_ACCESS_KEY || '' }}
          AWS_SESSION_TOKEN: ${{ secrets.SKILLSBENCH_PRIVATE_PROOF_AWS_SESSION_TOKEN || secrets.AWS_SESSION_TOKEN || '' }}
          AWS_REGION: ${{ secrets.SKILLSBENCH_PRIVATE_PROOF_AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.SKILLSBENCH_PRIVATE_PROOF_S3_ENDPOINT_URL || secrets.AWS_ENDPOINT_URL_S3 || '' }}
          R2_ENDPOINT_URL: ${{ secrets.SKILLSBENCH_PRIVATE_PROOF_R2_ENDPOINT_URL || secrets.R2_ENDPOINT_URL || '' }}
        run: |
          set -euo pipefail
          if [[ ! -d "${PRIVATE_PROOF_ROOT}" ]] || ! find "${PRIVATE_PROOF_ROOT}" -mindepth 2 -name proof.json -print -quit | grep -q .; then
            echo "durable private proof is required but no collected proof.json manifests exist" >&2
            exit 1
          fi
          case "${PRIVATE_PROOF_URI_PREFIX}" in
            s3://*)
              if ! command -v aws >/dev/null 2>&1; then
                python -m pip install --user awscli
                export PATH="${HOME}/.local/bin:${PATH}"
              fi
              if [[ -n "${AWS_ENDPOINT_URL_S3}" ]]; then
                aws configure set default.s3.addressing_style path
                aws s3 sync --only-show-errors "${PRIVATE_PROOF_ROOT}/" "${PRIVATE_PROOF_URI_PREFIX%/}/" --endpoint-url "${AWS_ENDPOINT_URL_S3}"
              else
                aws s3 sync --only-show-errors "${PRIVATE_PROOF_ROOT}/" "${PRIVATE_PROOF_URI_PREFIX%/}/"
              fi
              ;;
            r2://*)
              if ! command -v aws >/dev/null 2>&1; then
                python -m pip install --user awscli
                export PATH="${HOME}/.local/bin:${PATH}"
              fi
              endpoint="${R2_ENDPOINT_URL:-${AWS_ENDPOINT_URL_S3:-}}"
              if [[ -z "${endpoint}" ]]; then
                echo "r2:// private proof publishing requires SKILLSBENCH_PRIVATE_PROOF_R2_ENDPOINT_URL or R2_ENDPOINT_URL" >&2
                exit 1
              fi
              aws s3 sync --only-show-errors "${PRIVATE_PROOF_ROOT}/" "s3://${PRIVATE_PROOF_URI_PREFIX#r2://}/" --endpoint-url "${endpoint}"
              ;;
            gs://*)
              if ! command -v gcloud >/dev/null 2>&1; then
                echo "gs:// private proof publishing requires gcloud on the runner" >&2
                exit 1
              fi
              gcloud storage cp --recursive "${PRIVATE_PROOF_ROOT}/*" "${PRIVATE_PROOF_URI_PREFIX%/}/"
              ;;
            *)
              echo "unsupported private_proof_uri_prefix for workflow publishing: ${PRIVATE_PROOF_URI_PREFIX}" >&2
              exit 1
              ;;
          esac

      - name: Stop scenario
        if: always()
        run: docker compose -f "${AMBER_COMPOSE_DIR}/compose.yaml" -p "${AMBER_COMPOSE_PROJECT}" down -v --remove-orphans || true

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shard-${{ matrix.shard_index }}
          path: |
            ${{ env.AMBER_COMPOSE_DIR }}/output/results.json
            ${{ env.AMBER_COMPOSE_DIR }}/output/provenance.json
            ${{ env.AMBER_COMPOSE_DIR }}/output/private-proof-manifest-refs.json
            amber-proxy.log

  summary:
    needs: [setup, eval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NUM_SHARDS: ${{ needs.setup.outputs.num_shards }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Download all shard artifacts
        uses: actions/download-artifact@v8
        with:
          path: shard-artifacts
          pattern: shard-*
          merge-multiple: false

      - name: Build submission scenario metadata
        env:
          GREEN_AGENT_ID: ${{ inputs.green_agent_id || '' }}
          PURPLE_AGENT_ID: ${{ inputs.purple_agent_id || '' }}
          TASK_SET_INPUT: ${{ inputs.task_set || '' }}
          REQUIRE_DURABLE_PRIVATE_PROOF: ${{ inputs.require_durable_private_proof && 'true' || 'false' }}
          PRIVATE_PROOF_URI_PREFIX: ${{ inputs.private_proof_uri_prefix || '' }}
          PRIVATE_PROOF_RETENTION: ${{ inputs.private_proof_retention || '' }}
        run: |
          set -euo pipefail
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          task_set_re='^[A-Za-z0-9_.-]+$'
          durable_uri_re='^(s3|gs|r2)://'
          if [[ -n "${GREEN_AGENT_ID}" && ! "${GREEN_AGENT_ID}" =~ ${uuid_re} ]]; then
            echo "green_agent_id must be a registered AgentBeats UUID" >&2
            exit 1
          fi
          if [[ -n "${PURPLE_AGENT_ID}" && ! "${PURPLE_AGENT_ID}" =~ ${uuid_re} ]]; then
            echo "purple_agent_id must be a registered AgentBeats UUID" >&2
            exit 1
          fi
          task_set_manifest='null'
          prebuilt_manifest='null'
          if [[ -n "${TASK_SET_INPUT}" ]]; then
            if [[ ! "${TASK_SET_INPUT}" =~ ${task_set_re} ]]; then
              echo "task_set must be a direct task_sets/*.json manifest name" >&2
              exit 1
            fi
            task_set_path="task_sets/${TASK_SET_INPUT}.json"
            if [[ ! -f "${task_set_path}" ]]; then
              echo "task_set manifest not found: ${task_set_path}" >&2
              exit 1
            fi
            task_set_manifest="$(jq -c . "${task_set_path}")"
            prebuilt_path="prebuilt_images/${TASK_SET_INPUT}.json"
            if [[ -f "${prebuilt_path}" && "${TASK_SET_INPUT}" != "standard-v1" ]]; then
              jq -e '
                type == "object" and
                all(to_entries[]; (.key | type == "string") and (.value | type == "string" and contains("@sha256:")))
              ' "${prebuilt_path}" >/dev/null
              prebuilt_manifest="$(jq -c . "${prebuilt_path}")"
            fi
          fi
          if [[ "${REQUIRE_DURABLE_PRIVATE_PROOF}" == "true" ]]; then
            if [[ ! "${PRIVATE_PROOF_URI_PREFIX}" =~ ${durable_uri_re} ]]; then
              echo "private_proof_uri_prefix must use s3://, gs://, or r2:// when durable proof is required by this workflow" >&2
              exit 1
            fi
            if [[ "${PRIVATE_PROOF_URI_PREFIX}" =~ [?#] ]]; then
              echo "private_proof_uri_prefix must not contain a query string or fragment" >&2
              exit 1
            fi
            if [[ "${PRIVATE_PROOF_URI_PREFIX}" =~ (^local://|^file://|^memory://|localhost|127[.]0[.]0[.]1|^/) ]]; then
              echo "private_proof_uri_prefix must not be local or worker-local storage" >&2
              exit 1
            fi
            if [[ -z "${PRIVATE_PROOF_RETENTION}" || "${PRIVATE_PROOF_RETENTION}" =~ (local|debug|temporary|tmp|^none$|^0[[:alnum:]_]*) ]]; then
              echo "private_proof_retention must be a durable retention policy when durable proof is required" >&2
              exit 1
            fi
          elif [[ -n "${PRIVATE_PROOF_URI_PREFIX}" || -n "${PRIVATE_PROOF_RETENTION}" ]]; then
            echo "private proof overrides require require_durable_private_proof=true" >&2
            exit 1
          fi
          npx json5 "${SCENARIO_PATH}" | jq \
            --argjson num_shards ${NUM_SHARDS} \
            --argjson num_instances '${{ inputs.num_instances || 'null' }}' \
            --argjson task_set_manifest "${task_set_manifest}" \
            --argjson prebuilt_manifest "${prebuilt_manifest}" \
            --arg green_agent_id "${GREEN_AGENT_ID}" \
            --arg purple_agent_id "${PURPLE_AGENT_ID}" \
            --argjson require_durable_private_proof "${REQUIRE_DURABLE_PRIVATE_PROOF}" \
            --arg private_proof_uri_prefix "${PRIVATE_PROOF_URI_PREFIX}" \
            --arg private_proof_retention "${PRIVATE_PROOF_RETENTION}" \
            '
             .components.gateway.config.assessment_config.num_shards = $num_shards |
             if $task_set_manifest then
               .components.gateway.config.assessment_config.task_set = $task_set_manifest.task_set |
               if $task_set_manifest.task_set == "standard-v1" then
                 .components.gateway.config.assessment_config.tasks = "all" |
                 del(.components.gateway.config.assessment_config.task_ids)
               else
                 .components.gateway.config.assessment_config.task_ids = ($task_set_manifest.tasks | map(.task_id)) |
                 del(.components.gateway.config.assessment_config.tasks)
               end |
               .components.gateway.config.assessment_config.condition = $task_set_manifest.condition |
               .components.gateway.config.assessment_config.allow_excluded_tasks = $task_set_manifest.allow_excluded_tasks
             else . end |
             if $prebuilt_manifest and (.components.skillsbench_worker? != null) then
               .components.skillsbench_worker.config.prebuilt_images = ($prebuilt_manifest | tojson)
             elif $prebuilt_manifest and (.components.skillsbench_green? != null) then
               .components.skillsbench_green.config.prebuilt_images = ($prebuilt_manifest | tojson)
             elif $prebuilt_manifest then
               error("prebuilt_images require a skillsbench_worker or skillsbench_green component")
             else . end |
             if $num_instances then .components.gateway.config.assessment_config.num_instances = $num_instances else . end |
             if $green_agent_id != "" then .metadata.agentbeats_ids.skillsbench_green = $green_agent_id else . end |
             if $purple_agent_id != "" then
               .metadata.agentbeats_ids.baseline_agent = $purple_agent_id |
               .components.gateway.config.assessment_config.participant_ids.agent = $purple_agent_id
             else . end |
             if $require_durable_private_proof and (.components.skillsbench_worker? != null) then
               .components.skillsbench_worker.config.require_durable_private_proof = true |
               .components.skillsbench_worker.config.private_proof_uri_prefix = $private_proof_uri_prefix |
               .components.skillsbench_worker.config.private_proof_retention = $private_proof_retention
             elif $require_durable_private_proof and (.components.skillsbench_green? != null) then
               .components.skillsbench_green.config.require_durable_private_proof = true |
               .components.skillsbench_green.config.private_proof_uri_prefix = $private_proof_uri_prefix |
               .components.skillsbench_green.config.private_proof_retention = $private_proof_retention
             elif $require_durable_private_proof then
               error("durable private proof requires a skillsbench_worker or skillsbench_green component")
             else . end
            ' > submission-scenario.json5

      - name: Aggregate results
        run: |
          set -euo pipefail
          # Single-artifact downloads extract flat; normalize to subdirs
          if [[ -f "shard-artifacts/results.json" && ! -d "shard-artifacts/shard-0" ]]; then
            mkdir -p shard-artifacts/shard-0
            mv shard-artifacts/results.json shard-artifacts/shard-0/
            mv shard-artifacts/provenance.json shard-artifacts/shard-0/ 2>/dev/null || true
          fi
          if [[ -f "shard-artifacts/private-proof-manifest-refs.json" && ! -f "shard-artifacts/shard-0/private-proof-manifest-refs.json" ]]; then
            mkdir -p shard-artifacts/shard-0
            mv shard-artifacts/private-proof-manifest-refs.json shard-artifacts/shard-0/
          fi
          # Build expected file paths from shard count
          shard_results=()
          for i in $(seq 0 $(( ${NUM_SHARDS} - 1 ))); do
            f="shard-artifacts/shard-${i}/results.json"
            if [[ ! -f "$f" ]]; then
              echo "ERROR: missing results for shard ${i}" >&2
              ls -R shard-artifacts/ >&2 || true
              exit 1
            fi
            shard_results+=("$f")
          done
          # Extract the registered purple AgentBeats ID from scenario metadata.
          participants=$(npx json5 submission-scenario.json5 | jq -c '{agent: (.metadata.agentbeats_ids.baseline_agent // .metadata.agentbeats_ids.agent // "")}')
          jq -s --argjson participants "$participants" '{
            status: (if all(.[]; .status == "completed") then "completed"
                    elif any(.[]; .status == "completed") then "partial"
                    else "failed" end),
            participants: $participants,
            results: [
              .[]
              | .results[]
              | if type == "object" and (.results | type == "array") then .results[] else . end
              | select(type == "object")
            ]
          }' "${shard_results[@]}" > results.json

      - name: Validate and merge provenance
        run: |
          set -euo pipefail
          shard_provenance=()
          for i in $(seq 0 $(( ${NUM_SHARDS} - 1 ))); do
            f="shard-artifacts/shard-${i}/provenance.json"
            if [[ ! -f "$f" ]]; then
              echo "ERROR: missing provenance for shard ${i}" >&2
              ls -R shard-artifacts/ >&2 || true
              exit 1
            fi
            shard_provenance+=("$f")
          done
          # image_digests and github_actions must be identical across shards
          expected_image_digests=$(jq '.image_digests' "${shard_provenance[0]}")
          expected_github_actions=$(jq '.github_actions' "${shard_provenance[0]}")
          timestamps='[]'
          manifest_digests='[]'
          for f in "${shard_provenance[@]}"; do
            got=$(jq '.image_digests' "$f")
            if [[ "$got" != "$expected_image_digests" ]]; then
              echo "ERROR: image_digests mismatch in $f" >&2; exit 1
            fi
            got=$(jq '.github_actions' "$f")
            if [[ "$got" != "$expected_github_actions" ]]; then
              echo "ERROR: github_actions mismatch in $f" >&2; exit 1
            fi
            timestamps=$(echo "$timestamps" | jq --argjson ts "$(jq '.timestamp' "$f")" '. + [$ts]')
            manifest_digests=$(echo "$manifest_digests" | jq --argjson md "$(jq '.manifest_digests' "$f")" '. + [$md]')
          done
          # Use the first shard's values (all shards are identical).
          jq -n \
            --argjson image_digests "$expected_image_digests" \
            --argjson manifest_digests "$(echo "$manifest_digests" | jq '.[0]')" \
            --arg timestamp "$(echo "$timestamps" | jq -r '.[0]')" \
            --argjson github_actions "$expected_github_actions" \
            '{
              image_digests: $image_digests,
              manifest_digests: $manifest_digests,
              timestamp: $timestamp,
              github_actions: $github_actions
            }' > provenance.json
          echo "Provenance:"
          cat provenance.json

      - name: Aggregate private proof refs
        env:
          REQUIRE_DURABLE_PRIVATE_PROOF: ${{ inputs.require_durable_private_proof && 'true' || 'false' }}
          PRIVATE_PROOF_URI_PREFIX: ${{ inputs.private_proof_uri_prefix || '' }}
          PRIVATE_PROOF_RETENTION: ${{ inputs.private_proof_retention || '' }}
        run: |
          set -euo pipefail
          proof_ref_files=()
          for i in $(seq 0 $(( ${NUM_SHARDS} - 1 ))); do
            f="shard-artifacts/shard-${i}/private-proof-manifest-refs.json"
            if [[ -f "$f" ]]; then
              proof_ref_files+=("$f")
            elif [[ "${REQUIRE_DURABLE_PRIVATE_PROOF}" == "true" ]]; then
              echo "ERROR: missing private proof refs for shard ${i}" >&2
              ls -R shard-artifacts/ >&2 || true
              exit 1
            fi
          done
          if [[ "${#proof_ref_files[@]}" -eq 0 ]]; then
            if [[ "${REQUIRE_DURABLE_PRIVATE_PROOF}" == "true" ]]; then
              echo "ERROR: durable private proof was required but no private proof refs were produced" >&2
              exit 1
            fi
            rm -f private-proof-manifest-refs.json
            exit 0
          fi
          jq -s \
            --arg private_proof_storage "${PRIVATE_PROOF_URI_PREFIX%/}" \
            --arg private_proof_retention "${PRIVATE_PROOF_RETENTION}" \
            '{
              private_proof_storage: $private_proof_storage,
              private_proof_retention: $private_proof_retention,
              private_proof_manifest_refs: ([.[].private_proof_manifest_refs[]] | unique)
            }' "${proof_ref_files[@]}" > private-proof-manifest-refs.json
          jq -e '
            .private_proof_storage as $storage |
            ($storage | type == "string" and length > 0) and
            (.private_proof_retention | type == "string" and length > 0) and
            (.private_proof_manifest_refs | type == "array" and length > 0) and
            all(.private_proof_manifest_refs[]; type == "string" and startswith($storage + "/") and endswith("/proof.json"))
          ' private-proof-manifest-refs.json >/dev/null
          echo "Private proof manifest refs:"
          cat private-proof-manifest-refs.json

      - name: Generate submission metadata
        id: metadata
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          USERNAME=${{ github.repository_owner }}
          UNIQUE_NAME="${USERNAME}-${TIMESTAMP}"
          echo "unique_name=$UNIQUE_NAME" >> $GITHUB_OUTPUT
          echo "branch_name=submission-${UNIQUE_NAME}" >> $GITHUB_OUTPUT

      - name: Determine target repository
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PARENT_REPO=$(gh api repos/${{ github.repository }} --jq '.parent.full_name // "${{ github.repository }}"')
          echo "Target repository: $PARENT_REPO"
          echo "repo=$PARENT_REPO" >> $GITHUB_OUTPUT

      - name: Create submission branch and commit results
        env:
          UNIQUE_NAME: ${{ steps.metadata.outputs.unique_name }}
          BRANCH_NAME: ${{ steps.metadata.outputs.branch_name }}
          TARGET_REPO: ${{ steps.target.outputs.repo }}
        run: |
          cp submission-scenario.json5 /tmp/scenario.json5
          git remote add upstream https://github.com/${TARGET_REPO}.git
          git fetch upstream
          git checkout -b ${BRANCH_NAME} upstream/main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p results submissions
          cp /tmp/scenario.json5 "submissions/${UNIQUE_NAME}.json5"
          mv results.json "results/${UNIQUE_NAME}.json"
          mv provenance.json "submissions/${UNIQUE_NAME}-provenance.json"
          git add "results/${UNIQUE_NAME}.json" "submissions/${UNIQUE_NAME}-provenance.json" "submissions/${UNIQUE_NAME}.json5"
          if [[ -f private-proof-manifest-refs.json ]]; then
            mv private-proof-manifest-refs.json "submissions/${UNIQUE_NAME}-private-proof-manifest-refs.json"
            git add "submissions/${UNIQUE_NAME}-private-proof-manifest-refs.json"
          fi
          git commit -m "Submission: ${UNIQUE_NAME}

          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push origin ${BRANCH_NAME}
          echo "::notice title=Submission Branch Created::Your results are ready for submission on branch: ${BRANCH_NAME}"

      - name: Output PR link
        env:
          TARGET_REPO: ${{ steps.target.outputs.repo }}
          BRANCH_NAME: ${{ steps.metadata.outputs.branch_name }}
        run: |
          echo "### Submit your results" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to open a pull request](https://github.com/${TARGET_REPO}/compare/main...${{ github.repository_owner }}:${{ github.event.repository.name }}:${BRANCH_NAME}?expand=1)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "When creating the PR, UNCHECK 'Allow edits and access to secrets by maintainers' to protect your secrets." >> $GITHUB_STEP_SUMMARY
