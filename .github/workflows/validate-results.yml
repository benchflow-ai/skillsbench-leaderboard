name: Validate results

on:
  pull_request:
    paths:
      - "results/**"
      - "scripts/validate_results_schema.py"
      - ".github/workflows/validate-results.yml"
  push:
    branches:
      - main
    paths:
      - "results/**"
      - "scripts/validate_results_schema.py"
      - ".github/workflows/validate-results.yml"

jobs:
  validate-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_results_schema.py
